app = "feedbackbot"

[build]

[env]
  PORT = "8080"

[processes]
  app = "python bot.py"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  processes = ["app"]
  
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
  
  [[services.ports]]
    port = 80
    handlers = ["http"]
  
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = 10000
    grace_period = "5s"
    method = "get"
    path = "/"
    protocol = "http"
    timeout = 2000
    tls_skip_verify = false